<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- favicons -->
    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />

    <!-- Google Fonts -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css?family=Quicksand">
    <style>
        * {
            font-family: 'Quicksand', sans-serif;
        }
    </style>

    <!-- local scripts -->
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/tailwind.css">
    <script src="js/layout.js" defer></script>
</head>

<body class="site-body">
    <!-- header -->
    <header id="header" class="site-header mb-4">
        <div class="header-inner">
            <a href="index.html">
                <img src="images/mapmimic.png" alt="Map Mimic logo" class="logo-img">
            </a>
            <div class="site-title">
                Map Mimic - D&D Combat Map Site
            </div>
            
            <!--desktop menu (for large screen size)-->
            <nav class="desktop-menu">
                <a class="nav-link mm-hover" href="about.html">
                    <img src="images/mm_selector.png" class="mm-selector-hidden nav-selector-img">
                    <div class="nav-label self-center">About</div>
                </a>
                <a class="nav-link mm-selected" href="tutorial.html">
                    <img src="images/mm_selector.png" class="mm-selector nav-selector-img w-[130px]">
                    <div class="nav-label mt-12 mm-text">Tutorial</div>
                </a>
                <a class="nav-link mm-hover" href="index.html">
                    <img src="images/mm_selector.png" class="mm-selector-hidden nav-selector-img z-30">
                    <div class="nav-label self-center">Home</div>
                </a>
            </nav>


            <!--mobile menu (for small and medium screen size)-->
            <!--button to open menu-->
            <button class="mobile-menu-btn z-20" id="header-dropdown-open" onclick="openHeaderDropdown();">
                <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="40px" height="64px" viewBox="0 0 32 32" enable-background="new 0 0 32 32" id="Editable-line" version="1.1" xml:space="preserve" fill="#F8F3F2" stroke="#F8F3F2">
                    <g id="SVGRepo_bgCarrier" stroke-width="0"/>
                    <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"/>
                    <g id="SVGRepo_iconCarrier">
                    <line fill="none" id="XMLID_103_" stroke="#F8F3F2" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" stroke-width="2" x1="7" x2="25" y1="16" y2="16"/>
                    <line fill="none" id="XMLID_102_" stroke="#F8F3F2" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" stroke-width="2" x1="7" x2="25" y1="25" y2="25"/>
                    <line fill="none" id="XMLID_101_" stroke="#F8F3F2" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" stroke-width="2" x1="7" x2="25" y1="7" y2="7"/>
                    </g>
                </svg>
            </button>
            <!--hidden button to close menu-->
            <button class="hidden mobile-menu-btn z-20" id="header-dropdown-close" onclick="closeHeaderDropdown();">
                <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="40px" height="64px" viewBox="0 0 32 32" enable-background="new 0 0 32 32" id="Editable-line" version="1.1" xml:space="preserve" fill="#F8F3F2" stroke="#F8F3F2">
                    <g id="SVGRepo_bgCarrier" stroke-width="0"/>
                    <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"/>
                    <g id="SVGRepo_iconCarrier">
                    <line fill="none" id="XMLID_103_" stroke="#F8F3F2" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" stroke-width="2" x1="7" x2="25" y1="16" y2="16"/>
                    <line fill="none" id="XMLID_102_" stroke="#F8F3F2" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" stroke-width="2" x1="7" x2="25" y1="25" y2="25"/>
                    <line fill="none" id="XMLID_101_" stroke="#F8F3F2" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="10" stroke-width="2" x1="7" x2="25" y1="7" y2="7"/>
                    </g>
                </svg>
            </button>
            <!--dropdown menu-->
            <div id="header-dropdown" class="mobile-dropdown hidden">
                <nav class="mobile-nav">
                    <a href="about.html" class="mobile-nav-link">About</a>
                    <a href="tutorial.html" class="mobile-nav-link">Tutorial</a>
                    <a href="index.html" class="mobile-nav-link">Home</a>
                </nav>
            </div>
        </div>
    </header>

    <!-- main content -->
    <div class="flex-1 p-4">
        TODO: add a tutorial. This will be done a lot later in the project.<br><br>
    </div>

    <!-- footer -->
    <footer class="site-footer">
        <img class="footer-logo" src="images/mm_footer.png">
        <div class="triangle"></div>
        <div class="footer-text">
            Map Mimic is open-source. Check out our
            <a href="https://github.com/voronv27/combat-map"
                class="link-accent underline">
                Github Repo</a>, it (probably) doesn't bite!
        </div>
    </footer>
</body>
</html>
