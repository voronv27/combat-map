<svg fill="none"
  viewBox="0 0 100 100"
  xmlns="http://www.w3.org/2000/svg">
  <defs>
    <rect id="square-shape" class="shape-fill"
      fill="var(--shape-background)" x="10" y="10" width="80" height="80" rx="12" ry="12"/>
    <clipPath id="square-clip">
      <use href="#square-shape" />
    </clipPath>
  </defs>
  <image class="shape-image hidden" 
    clip-path="url(#square-clip)"/>
  <use href="#square-shape" fill="none"
    stroke="var(--shape-border-color)" stroke-width="var(--shape-border-width)" stroke-linejoin="round"/>
</svg>